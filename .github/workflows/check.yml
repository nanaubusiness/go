name: check
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Printed QR link -> redirect page -> live Lessicon
        run: |
          set -eu
          base=https://nanaubusiness.github.io/go
          page=$(curl -sL "$base/uptime-check")
          echo "$page" | grep -q "Opening Lessicon" && echo "redirect page: ok"
          target=$(curl -sf "$base/target.json?t=$(date +%s)" | jq -r .target)
          echo "redirect target: $target"
          probe=$(curl -s --max-time 20 "$target/__mobile")
          echo "app probe: $probe"
          echo "$probe" | grep -q '"app":"lessicon"'
          scan=$(curl -s -o /dev/null --max-time 60 -w "%{http_code} %{redirect_url}" "$target/go/uptime-check")
          echo "scan: $scan"
          test "$scan" = "302 $target/?src=uptime-check"
          landing=$(curl -s -o /dev/null --max-time 90 -w "%{http_code}" "$target/?src=uptime-check")
          echo "landing: $landing"
          test "$landing" = 200
      - name: Own domain -> www and sites hosts route right
        run: |
          set -eu
          www=$(curl -s -o /dev/null --max-time 30 -w "%{http_code} %{redirect_url}" https://www.lessicon.com/create)
          echo "www: $www"
          test "$www" = "308 https://lessicon.com/create"
          sites=$(curl -s -o /dev/null --max-time 30 -w "%{http_code} %{redirect_url}" https://sites.lessicon.com/login)
          echo "sites host app page: $sites"
          test "$sites" = "308 https://lessicon.com/login"
          engine=$(curl -s -o /dev/null --max-time 30 -w "%{http_code}" https://sites.lessicon.com/sf-engine.js)
          echo "sites host engine: $engine"
          test "$engine" = 200
